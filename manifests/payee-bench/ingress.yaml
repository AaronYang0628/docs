apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payee-bench
  namespace: payee-bench
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pay.72602.space
      secretName: payee-bench-tls
  rules:
    - host: pay.72602.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payee-bench
                port:
                  number: 3000
