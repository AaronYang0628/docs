apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-moderation-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: moderation
  source:
    repoURL: https://github.com/AaronYang0628/ollama-moderation-gateway.git
    targetRevision: ed0d412
    path: charts/ollama-moderation-gateway
    helm:
      releaseName: ollama-moderation-gateway
      values: |
        fullnameOverride: ollama-moderation-gateway
        replicaCount: 3

        image:
          repository: ghcr.io/aaronyang0628/ollama-moderation-gateway
          digest: sha256:6957f8a32ad93577500c6952d7dd0b9ae970672b82570144852c5fe5766773c5
          pullPolicy: IfNotPresent

        secrets:
          create: false
          existingSecret: ollama-moderation-gateway

        env:
          APP_ENV: production
          APP_HOST: 0.0.0.0
          APP_PORT: "8000"
          OLLAMA_BASE_URL: https://ollama.com
          DEFAULT_MODERATION_MODEL: moderation-fast
          POLICY_PATH: configs/policy.yaml
          OLLAMA_CONNECT_TIMEOUT_SECONDS: "5"
          OLLAMA_READ_TIMEOUT_SECONDS: "180"
          REQUEST_TIMEOUT_SECONDS: "190"
          KEY_COOLDOWN_SECONDS: "30"
          LOG_LEVEL: INFO
          LOG_RAW_INPUT: "false"
          ENABLE_DOCS: "false"

        ingress:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: lets-encrypt
            nginx.ingress.kubernetes.io/proxy-body-size: 5m
            nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
          hosts:
            - host: moderation.llm.72602.space
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: moderation.llm.72602.space-tls
              hosts:
                - moderation.llm.72602.space

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
