apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: charge-spot-quest
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: charge-spot
  source:
    repoURL: https://github.com/AaronYang0628/charge-spot-quest.git
    targetRevision: 7dfd1c3f1ebdd5546df22e15db7e87d271c35b71
    path: charts/charge-spot-quest
    helm:
      releaseName: charge-spot-quest
      values: |
        fullnameOverride: charge-spot-quest
        replicaCount: 1

        image:
          repository: ghcr.io/aaronyang0628/charge-spot-quest
          tag: "0.1.14"
          digest: sha256:294507227043b9c719dc2abc47161d6fd7e4b9cc921ba58d5848b2a80adfd53f
          pullPolicy: IfNotPresent

        postgresql:
          enabled: false

        sqlite:
          enabled: true
          persistence:
            enabled: true
            size: 1Gi
            storageClass: local-path

        dingtalk:
          enabled: true
          existingSecret: charge-spot-dingtalk
          publicBaseUrl: https://charge.72602.space

        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 200m
            memory: 512Mi

        ingress:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: lets-encrypt
            nginx.ingress.kubernetes.io/proxy-body-size: 5m
          hosts:
            - host: charge.72602.space
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: charge.72602.space-tls
              hosts:
                - charge.72602.space

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
