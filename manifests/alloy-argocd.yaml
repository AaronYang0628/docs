apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitor
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.10.1
    helm:
      releaseName: alloy
      values: |
        controller:
          type: deployment
          replicas: 1
        alloy:
          enableReporting: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
          configMap:
            content: |
              otelcol.receiver.otlp "default" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }
                http {
                  endpoint = "0.0.0.0:4318"
                }
                output {
                  traces  = [otelcol.processor.attributes.sanitize_traces.input]
                  metrics = [otelcol.processor.batch.default.input]
                  logs    = [otelcol.processor.batch.default.input]
                }
              }

              otelcol.processor.attributes "sanitize_traces" {
                action {
                  pattern = `(?i)^(http\.(request|response)\.header\..*|db\.(query\.text|statement)|url\.full|ai\.(prompt|response\.(text|object|toolCalls)|toolCall\.(args|result))|gen_ai\.(prompt|completion|input|output).*)$`
                  action  = "delete"
                }

                output {
                  traces = [otelcol.processor.filter.trace_noise.input]
                }
              }

              otelcol.processor.filter "trace_noise" {
                error_mode = "ignore"

                traces {
                  span = [
                    `name == "GlobalHttpApi.health"`,
                    `name == "http.server GET" and attributes["url.path"] == "/global/health"`,
                    `name == "ProjectCopy.register"`,
                    `name == "SQLiteDrizzle.make"`,
                    `name == "sql.execute"`,
                    `name == "ModelsDev.refresh"`,
                    `name == "Truncate.cleanup"`,
                    `IsMatch(name, "^Flock\\.(acquire|effect|release)$")`,
                  ]
                }

                output {
                  traces = [otelcol.processor.batch.default.input]
                }
              }

              otelcol.processor.batch "default" {
                output {
                  traces  = [otelcol.exporter.otlp.tempo.input, otelcol.connector.spanmetrics.agent.input]
                  metrics = [otelcol.exporter.prometheus.default.input]
                  logs    = [otelcol.exporter.loki.default.input]
                }
              }

              otelcol.connector.spanmetrics "agent" {
                namespace                       = "ops_agent"
                aggregation_cardinality_limit = 5000
                metrics_flush_interval         = "15s"
                resource_metrics_key_attributes = ["service.name", "agent.project"]
                series_expiration              = "24h"

                dimension {
                  name = "agent.project"
                }
                dimension {
                  name = "ai.model.id"
                }
                dimension {
                  name = "ai.model.provider"
                }
                dimension {
                  name = "tool.name"
                }

                histogram {
                  unit = "s"
                  explicit {
                    buckets = ["10ms", "50ms", "100ms", "250ms", "500ms", "1s", "2s", "5s", "10s", "30s", "1m", "2m", "5m", "10m"]
                  }
                }

                exemplars {
                  enabled            = true
                  max_per_data_point = 2
                }

                output {
                  metrics = [otelcol.exporter.prometheus.default.input]
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.monitor.svc.cluster.local:4317"
                  tls {
                    insecure = true
                  }
                }
              }

              otelcol.exporter.prometheus "default" {
                forward_to = [prometheus.remote_write.default.receiver]
              }

              prometheus.remote_write "default" {
                endpoint {
                  url = "http://prometheus-server.monitor.svc.cluster.local/api/v1/write"
                }
              }

              otelcol.exporter.loki "default" {
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki-gateway.monitor.svc.cluster.local/loki/api/v1/push"
                }
              }

              logging {
                level  = "info"
                format = "logfmt"
              }
        service:
          enabled: true
          type: ClusterIP
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "12345"
            prometheus.io/path: /metrics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
