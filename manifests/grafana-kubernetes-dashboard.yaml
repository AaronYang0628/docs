apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-kubernetes-dashboard
  namespace: monitor
  labels:
    grafana_dashboard: "1"
data:
  kubernetes-resources.json: |
    {
      "annotations": { "list": [] },
      "description": "Kubernetes resource status for the 72602 and ZJLAB clusters. Select a cluster from the dashboard control.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "row",
          "title": "Cluster Overview",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Nodes",
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "count(max by (cluster, node) (kube_node_info{cluster=~\"${cluster:raw}\"}))",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value_and_name" }
        },
        {
          "type": "stat",
          "title": "Ready Nodes",
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "count(max by (cluster, node) (kube_node_status_condition{cluster=~\"${cluster:raw}\", condition=\"Ready\", status=\"true\"} == 1))",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          },
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value_and_name" }
        },
        {
          "type": "stat",
          "title": "Running Pods",
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(max by (cluster, namespace, pod) (kube_pod_status_phase{cluster=~\"${cluster:raw}\", phase=\"Running\"}))",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "textMode": "value_and_name" }
        },
        {
          "type": "stat",
          "title": "Pending / Failed Pods",
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(max by (cluster, namespace, pod) (kube_pod_status_phase{cluster=~\"${cluster:raw}\", phase=~\"Pending|Failed|Unknown\"}))",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 3 }] }
            },
            "overrides": []
          },
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value_and_name" }
        },
        {
          "type": "stat",
          "title": "CPU Requests",
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(max by (cluster, namespace, pod, container) (kube_pod_container_resource_requests{cluster=~\"${cluster:raw}\", resource=\"cpu\", unit=\"core\"}))",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "cores", "decimals": 2, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "textMode": "value_and_name" }
        },
        {
          "type": "stat",
          "title": "Memory Requests",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(max by (cluster, namespace, pod, container) (kube_pod_container_resource_requests{cluster=~\"${cluster:raw}\", resource=\"memory\", unit=\"byte\"}))",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "decimals": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "textMode": "value_and_name" }
        },
        {
          "type": "row",
          "title": "Node Resources",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Node CPU Usage",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "100 * (1 - avg by (cluster, node) (rate(node_cpu_seconds_total{cluster=~\"${cluster:raw}\", node=~\"${node:regex}\", job=\"kubernetes-service-endpoints\", mode=\"idle\"}[$__rate_interval])))",
              "legendFormat": "{{cluster}} {{node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 70 }, { "color": "red", "value": 90 }] }
            },
            "overrides": []
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Node Memory Usage",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes{cluster=~\"${cluster:raw}\", node=~\"${node:regex}\", job=\"kubernetes-service-endpoints\"} / node_memory_MemTotal_bytes{cluster=~\"${cluster:raw}\", node=~\"${node:regex}\", job=\"kubernetes-service-endpoints\"}))",
              "legendFormat": "{{cluster}} {{node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 75 }, { "color": "red", "value": 90 }] }
            },
            "overrides": []
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Node Filesystem Usage",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "100 * (1 - (node_filesystem_avail_bytes{cluster=~\"${cluster:raw}\", node=~\"${node:regex}\", job=\"kubernetes-service-endpoints\", mountpoint=\"/\", fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{cluster=~\"${cluster:raw}\", node=~\"${node:regex}\", job=\"kubernetes-service-endpoints\", mountpoint=\"/\", fstype!~\"tmpfs|overlay\"}))",
              "legendFormat": "{{cluster}} {{node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 }] }
            },
            "overrides": []
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Node Network Traffic",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (cluster, node) (rate(node_network_receive_bytes_total{cluster=~\"${cluster:raw}\", node=~\"${node:regex}\", job=\"kubernetes-service-endpoints\", device!~\"lo|veth.*|cali.*\"}[$__rate_interval]))",
              "legendFormat": "rx {{cluster}} {{node}}",
              "refId": "A"
            },
            {
              "expr": "sum by (cluster, node) (rate(node_network_transmit_bytes_total{cluster=~\"${cluster:raw}\", node=~\"${node:regex}\", job=\"kubernetes-service-endpoints\", device!~\"lo|veth.*|cali.*\"}[$__rate_interval]))",
              "legendFormat": "tx {{cluster}} {{node}}",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps", "decimals": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } }, "overrides": [] },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "row",
          "title": "Workloads",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Top Pods by CPU",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "topk(10, sum by (cluster, namespace, pod) (rate(container_cpu_usage_seconds_total{cluster=~\"${cluster:raw}\", namespace=~\"${namespace:regex}\", container!=\"\", container!=\"POD\", image!=\"\"}[$__rate_interval])))",
              "legendFormat": "{{cluster}} {{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "cores", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } }, "overrides": [] },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Top Pods by Memory",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "topk(10, sum by (cluster, namespace, pod) (container_memory_working_set_bytes{cluster=~\"${cluster:raw}\", namespace=~\"${namespace:regex}\", container!=\"\", container!=\"POD\", image!=\"\"}))",
              "legendFormat": "{{cluster}} {{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "decimals": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } }, "overrides": [] },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "table",
          "title": "Pod Phase by Namespace",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 33 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (cluster, namespace, phase) (max by (cluster, namespace, pod, phase) (kube_pod_status_phase{cluster=~\"${cluster:raw}\", namespace=~\"${namespace:regex}\"}))",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "inspect": false }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } }, "overrides": [] },
          "options": { "cellHeight": "sm", "showHeader": true },
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "indexByName": { "cluster": 0, "namespace": 1, "phase": 2, "Value": 3 }, "renameByName": { "Value": "Pods" } } }
          ]
        },
        {
          "type": "table",
          "title": "Deployment Availability",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 33 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max by (cluster, namespace, deployment) (kube_deployment_status_replicas_available{cluster=~\"${cluster:raw}\", namespace=~\"${namespace:regex}\"})",
              "instant": true,
              "format": "table",
              "refId": "A"
            },
            {
              "expr": "max by (cluster, namespace, deployment) (kube_deployment_spec_replicas{cluster=~\"${cluster:raw}\", namespace=~\"${namespace:regex}\"})",
              "instant": true,
              "format": "table",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "inspect": false }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } }, "overrides": [] },
          "options": { "cellHeight": "sm", "showHeader": true },
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "Value #A": "Available", "Value #B": "Desired" } } }
          ]
        },
        {
          "type": "row",
          "title": "Storage and Monitoring",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 42 },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Persistent Volume Claim Usage",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 43 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "100 * (kubelet_volume_stats_used_bytes{cluster=~\"${cluster:raw}\", namespace=~\"${namespace:regex}\"} / kubelet_volume_stats_capacity_bytes{cluster=~\"${cluster:raw}\", namespace=~\"${namespace:regex}\"})",
              "legendFormat": "{{cluster}} {{namespace}}/{{persistentvolumeclaim}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 }] }
            },
            "overrides": []
          },
          "options": { "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "timeseries",
          "title": "Pod Restarts",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 43 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "topk(10, sum by (cluster, namespace, pod) (increase(kube_pod_container_status_restarts_total{cluster=~\"${cluster:raw}\", namespace=~\"${namespace:regex}\"}[$__range])))",
              "legendFormat": "{{cluster}} {{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "min": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 5 }] }
            },
            "overrides": []
          },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "type": "table",
          "title": "Scrape Targets",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 52 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (cluster, job) (up{cluster=~\"${cluster:raw}\"})",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "cellOptions": { "type": "color-background" }, "inspect": false },
              "mappings": [
                { "options": { "0": { "color": "red", "index": 0, "text": "Down" }, "1": { "color": "green", "index": 1, "text": "Up" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          },
          "options": { "cellHeight": "sm", "showHeader": true },
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "indexByName": { "cluster": 0, "job": 1, "Value": 2 }, "renameByName": { "Value": "Up targets" } } }
          ]
        },
        {
          "type": "stat",
          "title": "Prometheus Remote Write Failed",
          "description": "This is relevant for the ZJLAB-to-72602 metrics path. Zero is healthy.",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 52 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(prometheus_remote_storage_samples_failed_total)",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] }
            },
            "overrides": []
          },
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value_and_name" }
        },
        {
          "type": "stat",
          "title": "Prometheus TSDB Head Samples",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 52 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "prometheus_tsdb_head_samples",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "textMode": "value_and_name" }
        },
        {
          "type": "timeseries",
          "title": "Prometheus Ingest Rate",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 56 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(prometheus_tsdb_head_samples_appended_total[$__rate_interval])",
              "legendFormat": "local ingest",
              "refId": "A"
            },
            {
              "expr": "rate(prometheus_remote_storage_samples_in_total[$__rate_interval])",
              "legendFormat": "remote write receiver",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops", "decimals": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } }, "overrides": [] },
          "options": { "legend": { "calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["kubernetes", "resources", "72602", "zjlab"],
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "Cluster",
            "type": "custom",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "query": "72602 : ^$,zjlab : zjlab,All : .*",
            "options": [
              { "selected": true, "text": "72602", "value": "^$" },
              { "selected": false, "text": "zjlab", "value": "zjlab" },
              { "selected": false, "text": "All", "value": ".*" }
            ],
            "current": { "selected": true, "text": "72602", "value": "^$" }
          },
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(kube_node_info{cluster=~\"${cluster:raw}\"}, node)",
            "query": "label_values(kube_node_info{cluster=~\"${cluster:raw}\"}, node)",
            "refresh": 1,
            "sort": 1,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "hide": 0,
            "current": { "selected": true, "text": "All", "value": "$__all" }
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(kube_pod_info{cluster=~\"${cluster:raw}\"}, namespace)",
            "query": "label_values(kube_pod_info{cluster=~\"${cluster:raw}\"}, namespace)",
            "refresh": 1,
            "sort": 1,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "hide": 0,
            "current": { "selected": true, "text": "All", "value": "$__all" }
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "Kubernetes Resources",
      "uid": "kubernetes-resources-multicluster",
      "version": 1,
      "weekStart": ""
    }
