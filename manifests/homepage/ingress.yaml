apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: port.72602.space
      http:
        paths:
          - path: "/api/portal-tools"
            pathType: Prefix
            backend:
              service:
                name: portal-data
                port:
                  number: 8080
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
  tls:
    - hosts:
        - port.72602.space
      secretName: port.72602.space-tls
