# Dedicated NodePort on both cluster nodes. ZJLAB ingress-nginx is currently
# broken (unrelated incident), so this service deliberately bypasses it.
# The node IPs are ZJLAB-internal; there is no public route to them.
apiVersion: v1
kind: Service
metadata:
  name: mcp-inspector
  namespace: mcp-inspector
  labels:
    app.kubernetes.io/name: mcp-inspector
    app.kubernetes.io/part-of: mcp-inspector
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mcp-inspector
  ports:
    - name: ui
      port: 6274
      targetPort: ui
      nodePort: 30080
