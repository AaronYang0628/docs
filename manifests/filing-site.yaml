apiVersion: v1
kind: Namespace
metadata:
  name: application
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filing-site
  namespace: application
  labels:
    app.kubernetes.io/name: filing-site
data:
  nginx.conf: |
    worker_processes 1;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;
    events { worker_connections 128; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 30;
      server_tokens off;
      access_log off;
      client_max_body_size 25m;
      client_body_temp_path /data/.tmp 1 2;
      gzip on;
      gzip_types text/css application/javascript image/svg+xml;

      map $request_method $upload_realm {
        default off;
        PUT "72602 album upload";
      }

      server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
          add_header Content-Type text/plain;
          return 200 'ok';
        }

        location = /photos/aaron { return 301 /photos/aaron/; }
        location = /photos/licorice { return 301 /photos/licorice/; }
        location = /photos/yakult { return 301 /photos/yakult/; }

        location /photos/aaron/ {
          alias /data/files/aaron/;
          autoindex on;
          autoindex_format json;
          autoindex_localtime off;
          auth_basic $upload_realm;
          auth_basic_user_file /etc/nginx/auth/htpasswd;
          dav_methods PUT;
          create_full_put_path off;
          dav_access user:rw group:rw all:r;
          limit_except GET HEAD PUT { deny all; }
          add_header Cache-Control "no-store" always;
        }

        location /photos/licorice/ {
          alias /data/files/licorice/;
          autoindex on;
          autoindex_format json;
          autoindex_localtime off;
          auth_basic $upload_realm;
          auth_basic_user_file /etc/nginx/auth/htpasswd;
          dav_methods PUT;
          create_full_put_path off;
          dav_access user:rw group:rw all:r;
          limit_except GET HEAD PUT { deny all; }
          add_header Cache-Control "no-store" always;
        }

        location /photos/yakult/ {
          alias /data/files/yakult/;
          autoindex on;
          autoindex_format json;
          autoindex_localtime off;
          auth_basic $upload_realm;
          auth_basic_user_file /etc/nginx/auth/htpasswd;
          dav_methods PUT;
          create_full_put_path off;
          dav_access user:rw group:rw all:r;
          limit_except GET HEAD PUT { deny all; }
          add_header Cache-Control "no-store" always;
        }

        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <meta name="description" content="72602云端 — 门牌 72602 的家庭照片小站" />
      <title>72602云端</title>
      <style>
        :root {
          --ink: #1c1917;
          --soft: #57534e;
          --muted: #78716c;
          --paper: #faf7f2;
          --card: rgba(255, 252, 247, 0.78);
          --line: rgba(28, 25, 23, 0.08);
          --teal: #0f766e;
          --clay: #c2410c;
          --yellow: #a16207;
          --shadow: 0 30px 80px rgba(28, 25, 23, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; }
        body {
          font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
          color: var(--ink);
          background:
            radial-gradient(900px 520px at 8% 0%, rgba(15, 118, 110, 0.14), transparent 60%),
            radial-gradient(800px 480px at 100% 10%, rgba(194, 65, 12, 0.1), transparent 55%),
            linear-gradient(180deg, #f7f3ec 0%, #f3efe8 45%, #efeae2 100%);
        }
        button, input { font: inherit; }
        button { cursor: pointer; }
        .grain {
          pointer-events: none;
          position: fixed;
          inset: 0;
          opacity: 0.04;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
          z-index: 0;
        }
        .page {
          position: relative;
          z-index: 1;
          width: min(980px, calc(100% - 32px));
          margin: 0 auto;
          padding: 36px 0 64px;
        }
        header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
          margin-bottom: 28px;
        }
        .logo {
          display: flex;
          align-items: center;
          gap: 12px;
          font-weight: 650;
          letter-spacing: 0.01em;
        }
        .plate {
          min-width: 54px;
          height: 36px;
          padding: 0 10px;
          border-radius: 8px;
          border: 1.5px solid rgba(28, 25, 23, 0.18);
          background: linear-gradient(180deg, #fffdf9, #f3efe8);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 8px 18px rgba(28, 25, 23, 0.06);
          display: grid;
          place-items: center;
          font-variant-numeric: tabular-nums;
          font-size: 14px;
          letter-spacing: 0.12em;
          font-weight: 700;
        }
        .quiet { color: var(--muted); font-size: 13px; }
        .hero, .album-view {
          position: relative;
          overflow: hidden;
          border-radius: 28px;
          background: var(--card);
          border: 1px solid rgba(255, 255, 255, 0.7);
          box-shadow: var(--shadow);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          padding: clamp(28px, 5vw, 52px);
          margin-bottom: 18px;
        }
        .hero::before, .album-view::before {
          content: "";
          position: absolute;
          width: 280px;
          height: 280px;
          right: -60px;
          top: -80px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(15, 118, 110, 0.16), transparent 70%);
          pointer-events: none;
        }
        .eyebrow {
          position: relative;
          display: inline-flex;
          align-items: center;
          gap: 10px;
          color: var(--teal);
          font-size: 13px;
          font-weight: 600;
          margin-bottom: 16px;
        }
        .eyebrow::before {
          content: "";
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: var(--teal);
          box-shadow: 0 0 0 5px rgba(15, 118, 110, 0.12);
        }
        h1 {
          position: relative;
          font-size: clamp(2.1rem, 5vw, 3.35rem);
          line-height: 1.12;
          letter-spacing: -0.03em;
          max-width: 14ch;
          margin-bottom: 18px;
          font-weight: 720;
        }
        .lead {
          position: relative;
          max-width: 46ch;
          color: var(--soft);
          font-size: clamp(1.02rem, 2.1vw, 1.15rem);
          line-height: 1.85;
          margin-bottom: 10px;
        }
        .lead-en {
          position: relative;
          max-width: 52ch;
          color: var(--muted);
          font-size: 0.95rem;
          line-height: 1.7;
          margin-bottom: 28px;
        }
        .family {
          position: relative;
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 12px;
        }
        .person {
          display: flex;
          flex-direction: column;
          min-height: 184px;
          border-radius: 16px;
          padding: 18px 16px 14px;
          background: rgba(255, 255, 255, 0.62);
          border: 1px solid var(--line);
        }
        .person .who {
          font-size: 12px;
          font-weight: 650;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--muted);
          margin-bottom: 10px;
        }
        .person h2 { font-size: 1.25rem; margin-bottom: 8px; letter-spacing: -0.02em; }
        .person p { color: var(--soft); font-size: 0.92rem; line-height: 1.65; }
        .person.aaron { background: linear-gradient(180deg, rgba(15, 118, 110, 0.08), rgba(255, 255, 255, 0.55)); }
        .person.licorice { background: linear-gradient(180deg, rgba(194, 65, 12, 0.08), rgba(255, 255, 255, 0.55)); }
        .person.yakult { background: linear-gradient(180deg, rgba(234, 179, 8, 0.12), rgba(255, 255, 255, 0.55)); }
        .person-main { color: inherit; text-decoration: none; flex: 1; }
        .person-main:focus-visible, .back-link:focus-visible, button:focus-visible {
          outline: 3px solid rgba(15, 118, 110, 0.35);
          outline-offset: 3px;
        }
        .person-actions { display: flex; gap: 8px; margin-top: 14px; }
        .button, .upload-button {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 7px;
          min-height: 36px;
          padding: 7px 12px;
          border: 1px solid rgba(15, 118, 110, 0.18);
          border-radius: 8px;
          background: rgba(255, 255, 255, 0.72);
          color: var(--teal);
          font-size: 13px;
          font-weight: 650;
          text-decoration: none;
        }
        .button:hover, .upload-button:hover { background: #fff; border-color: rgba(15, 118, 110, 0.38); }
        .upload-button { border-color: rgba(194, 65, 12, 0.2); color: var(--clay); }
        .upload-button:hover { border-color: rgba(194, 65, 12, 0.4); }
        .story { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; }
        .block {
          border-radius: 22px;
          padding: clamp(22px, 3.5vw, 32px);
          background: rgba(255, 252, 247, 0.72);
          border: 1px solid rgba(255, 255, 255, 0.65);
          box-shadow: 0 18px 50px rgba(28, 25, 23, 0.06);
        }
        .block h3 { font-size: 1.05rem; margin-bottom: 12px; letter-spacing: -0.01em; }
        .block p { color: var(--soft); line-height: 1.8; font-size: 0.98rem; }
        .block + .block h3 { color: var(--teal); }
        .notes { display: grid; gap: 12px; margin-top: 14px; }
        .note { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; color: var(--soft); font-size: 0.94rem; line-height: 1.65; }
        .note i { width: 8px; height: 8px; margin-top: 8px; border-radius: 50%; background: var(--clay); opacity: 0.75; }
        .album-view[hidden], .home-view[hidden] { display: none; }
        .album-head { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
        .back-link { color: var(--muted); font-size: 13px; text-decoration: none; }
        .album-title { margin-top: 14px; font-size: clamp(1.8rem, 4vw, 2.7rem); letter-spacing: -0.03em; }
        .album-description { position: relative; color: var(--soft); line-height: 1.7; margin-top: 8px; }
        .album-actions { position: relative; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .upload-status { color: var(--muted); font-size: 13px; min-height: 20px; margin: 10px 0 18px; }
        .gallery { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .photo { overflow: hidden; min-width: 0; border-radius: 12px; background: rgba(28, 25, 23, 0.06); aspect-ratio: 1; }
        .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .empty { position: relative; grid-column: 1 / -1; padding: 38px 18px; border: 1px dashed rgba(28, 25, 23, 0.18); border-radius: 12px; color: var(--muted); text-align: center; }
        footer { margin-top: 22px; padding: 0 6px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 18px; color: var(--muted); font-size: 13px; }
        footer a { color: inherit; text-decoration: none; }
        footer a:hover { color: var(--ink); }
        @media (max-width: 820px) {
          .family, .story { grid-template-columns: 1fr; }
          h1 { max-width: none; }
          header { align-items: flex-start; flex-direction: column; }
        }
        @media (max-width: 520px) {
          .page { width: min(100% - 20px, 980px); padding-top: 22px; }
          .hero, .album-view { padding: 24px 18px; border-radius: 22px; }
          .album-head { flex-direction: column; }
          .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
          .person-actions { flex-wrap: wrap; }
        }
      </style>
    </head>
    <body>
      <div class="grain" aria-hidden="true"></div>
      <div class="page">
        <header>
          <a class="logo" href="#home" aria-label="返回 72602 云端首页">
            <div class="plate" title="门牌号">72602</div>
            <div>云端</div>
          </a>
          <div class="quiet">a small home on the internet</div>
        </header>

        <main>
          <div id="home-view" class="home-view">
            <section class="hero">
              <div class="eyebrow">来自门牌 72602</div>
              <h1>把家里的光，收进云里。</h1>
              <p class="lead">72602 是我们家的门牌号。这个小站不卖东西，也不热闹——只想给家里的照片、片段和随手记下的日子，留一个安静的位置。</p>
              <p class="lead-en">Named after our door number. A quiet place for home photos, little notes, and the days we want to keep.</p>

              <div class="family">
                <article class="person aaron">
                  <a class="person-main" href="#album/aaron">
                    <div class="who">Me</div>
                    <h2>Aaron</h2>
                    <p>家里的程序员兼兼职摄影师。负责按快门，也负责把文件塞进「云端」别弄丢。</p>
                  </a>
                  <div class="person-actions">
                    <a class="button" href="#album/aaron">进入相册</a>
                    <button class="upload-button" type="button" data-upload="aaron" aria-label="上传照片到 Aaron 相册"><span aria-hidden="true">+</span> 上传</button>
                  </div>
                </article>
                <article class="person licorice">
                  <a class="person-main" href="#album/licorice">
                    <div class="who">My love</div>
                    <h2>Licorice</h2>
                    <p>我的妻子。镜头前最好看的人，也是相册里出现频率最高的名字。</p>
                  </a>
                  <div class="person-actions">
                    <a class="button" href="#album/licorice">进入相册</a>
                    <button class="upload-button" type="button" data-upload="licorice" aria-label="上传照片到 Licorice 相册"><span aria-hidden="true">+</span> 上传</button>
                  </div>
                </article>
                <article class="person yakult">
                  <a class="person-main" href="#album/yakult">
                    <div class="who">Coming soon</div>
                    <h2>Yakult · 养乐多</h2>
                    <p>十月将与我们见面的小男孩。相册已经预留好他的第一页。</p>
                  </a>
                  <div class="person-actions">
                    <a class="button" href="#album/yakult">进入相册</a>
                    <button class="upload-button" type="button" data-upload="yakult" aria-label="上传照片到 Yakult 相册"><span aria-hidden="true">+</span> 上传</button>
                  </div>
                </article>
              </div>
            </section>

            <section class="story">
              <div class="block">
                <h3>这里放什么</h3>
                <p>门前的树影、晚饭后的客厅、旅行里拍糊的一张、以及以后养乐多的小手小脚。72602 云端更像家里的抽屉：不是秀场，只是把值得留下的影像和说明，轻轻叠好。</p>
                <div class="notes">
                  <div class="note"><i></i><span>家庭照片与影像目录</span></div>
                  <div class="note"><i></i><span>拍摄日期、地点和一句随手备注</span></div>
                  <div class="note"><i></i><span>只给我们自己慢慢回看</span></div>
                </div>
              </div>
              <div class="block">
                <h3>Why 72602</h3>
                <p>Every home has a number on the door. Ours is 72602. This site keeps our photo file information in one calm place — for Aaron, Licorice, and Yakult, who will join us this October.</p>
              </div>
            </section>
          </div>

          <section id="album-view" class="album-view" hidden>
            <div class="album-head">
              <div>
                <a class="back-link" href="#home">← 返回首页</a>
                <h1 id="album-title" class="album-title">相册</h1>
                <p id="album-description" class="album-description"></p>
              </div>
              <div class="album-actions">
                <button id="album-pick" class="upload-button" type="button"><span aria-hidden="true">+</span> 上传照片</button>
                <input id="album-files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
              </div>
            </div>
            <div id="upload-status" class="upload-status" role="status" aria-live="polite"></div>
            <div id="gallery" class="gallery"></div>
          </section>
        </main>

        <footer>
          <div>© 72602云端 · door no. 72602</div>
          <div>72602.space</div>
        </footer>
      </div>
      <input id="home-files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
      <script>
        (() => {
          const albums = {
            aaron: { title: "Aaron 的相册", description: "按下快门，也把值得留下的日子收进云里。" },
            licorice: { title: "Licorice 的相册", description: "镜头前最好看的人，拥有自己的相册。" },
            yakult: { title: "Yakult · 养乐多的相册", description: "为十月将来的小男孩，预留一页又一页。" }
          };
          const allowedTypes = new Set(["image/jpeg", "image/png", "image/webp"]);
          const maxFileSize = 25 * 1024 * 1024;
          const homeView = document.querySelector("#home-view");
          const albumView = document.querySelector("#album-view");
          const title = document.querySelector("#album-title");
          const description = document.querySelector("#album-description");
          const gallery = document.querySelector("#gallery");
          const status = document.querySelector("#upload-status");
          const homeFiles = document.querySelector("#home-files");
          const albumFiles = document.querySelector("#album-files");
          let activeAlbum = null;

          function albumFromHash() {
            const match = location.hash.match(/^#album\/(aaron|licorice|yakult)$/);
            return match ? match[1] : null;
          }

          function setStatus(message, isError = false) {
            status.textContent = message;
            status.style.color = isError ? "var(--clay)" : "";
          }

          async function loadAlbum(album) {
            activeAlbum = album;
            const info = albums[album];
            title.textContent = info.title;
            description.textContent = info.description;
            homeView.hidden = true;
            albumView.hidden = false;
            gallery.textContent = "";
            setStatus("正在读取相册...");
            try {
              const response = await fetch(`/photos/${album}/`, { cache: "no-store" });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const files = await response.json();
              const photos = files.filter((file) => file.type === "file" && /\.(jpe?g|png|webp)$/i.test(file.name));
              if (!photos.length) {
                gallery.innerHTML = '<div class="empty">相册还是空的，上传第一张照片吧。</div>';
              } else {
                photos.forEach((file) => {
                  const figure = document.createElement("figure");
                  figure.className = "photo";
                  const image = document.createElement("img");
                  image.loading = "lazy";
                  image.alt = file.name;
                  image.src = `/photos/${album}/${encodeURIComponent(file.name)}`;
                  figure.appendChild(image);
                  gallery.appendChild(figure);
                });
                setStatus(`${photos.length} 张照片`);
              }
            } catch (error) {
              gallery.innerHTML = '<div class="empty">相册暂时无法读取，请稍后再试。</div>';
              setStatus("读取相册失败", true);
            }
          }

          function renderHome() {
            activeAlbum = null;
            albumView.hidden = true;
            homeView.hidden = false;
            window.scrollTo(0, 0);
          }

          function route() {
            const album = albumFromHash();
            if (album) loadAlbum(album);
            else renderHome();
          }

          function askForAuth() {
            const username = window.prompt("上传账号", "uploader");
            if (!username) return null;
            const password = window.prompt("上传密码");
            if (password === null) return null;
            return `Basic ${btoa(`${username}:${password}`)}`;
          }

          function newName(file) {
            const extension = file.name.split(".").pop().toLowerCase();
            const random = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
            return `${Date.now()}-${random}.${extension}`;
          }

          async function uploadFiles(album, files) {
            if (!files.length) return;
            const auth = askForAuth();
            if (!auth) return;
            let uploaded = 0;
            setStatus(`准备上传 ${files.length} 张照片...`);
            for (const file of files) {
              if (!allowedTypes.has(file.type) || file.size > maxFileSize) {
                setStatus(`${file.name} 不是支持的图片或超过 25MiB`, true);
                continue;
              }
              setStatus(`正在上传 ${uploaded + 1}/${files.length}...`);
              try {
                const response = await fetch(`/photos/${album}/${encodeURIComponent(newName(file))}`, {
                  method: "PUT",
                  headers: { Authorization: auth, "Content-Type": file.type },
                  body: file
                });
                if (response.status === 401) {
                  setStatus("账号或密码不正确", true);
                  return;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                uploaded += 1;
              } catch (error) {
                setStatus(`${file.name} 上传失败`, true);
                return;
              }
            }
            setStatus(`已上传 ${uploaded} 张照片`);
            if (activeAlbum === album) loadAlbum(album);
          }

          document.querySelectorAll("[data-upload]").forEach((button) => {
            button.addEventListener("click", () => {
              homeFiles.dataset.album = button.dataset.upload;
              homeFiles.click();
            });
          });
          homeFiles.addEventListener("change", () => {
            uploadFiles(homeFiles.dataset.album, [...homeFiles.files]);
            homeFiles.value = "";
          });
          document.querySelector("#album-pick").addEventListener("click", () => albumFiles.click());
          albumFiles.addEventListener("change", () => {
            uploadFiles(activeAlbum, [...albumFiles.files]);
            albumFiles.value = "";
          });
          window.addEventListener("hashchange", route);
          route();
        })();
      </script>
    </body>
    </html>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filing-site-photos
  namespace: application
  labels:
    app.kubernetes.io/name: filing-site
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filing-site
  namespace: application
  labels:
    app.kubernetes.io/name: filing-site
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: filing-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filing-site
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-albums
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - mkdir -p /data/files/aaron /data/files/licorice /data/files/yakult /data/.tmp && chmod 0770 /data/.tmp && chmod 0775 /data/files/aaron /data/files/licorice /data/files/yakult
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: photos
              mountPath: /data
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
            - name: photos
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/cache/nginx
            - name: log
              mountPath: /var/log/nginx
      volumes:
        - name: html
          configMap:
            name: filing-site
            items:
              - key: index.html
                path: index.html
        - name: conf
          configMap:
            name: filing-site
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: auth
          secret:
            secretName: filing-site-upload-auth
            items:
              - key: htpasswd
                path: htpasswd
        - name: photos
          persistentVolumeClaim:
            claimName: filing-site-photos
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: log
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: filing-site
  namespace: application
  labels:
    app.kubernetes.io/name: filing-site
spec:
  selector:
    app.kubernetes.io/name: filing-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filing-site
  namespace: application
  labels:
    app.kubernetes.io/name: filing-site
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
