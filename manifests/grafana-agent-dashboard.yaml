apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-agent-dashboard
  namespace: monitor
  labels:
    grafana_dashboard: "1"
data:
  agent-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "CPU Usage %",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "100 - (avg by (cluster, node) (label_replace(rate(node_cpu_seconds_total{mode=\"idle\",cluster=~\"$cluster\"}[5m]), \"internal_ip\", \"$1\", \"instance\", \"([^:]+):.*\") * on (cluster, internal_ip) group_left(node) max by (cluster, node, internal_ip) (kube_node_info{cluster=~\"$cluster\",node=~\"$node\"})) * 100)",
              "legendFormat": "{{cluster}}/{{node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Memory Usage %",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "(1 - (sum by (cluster, node) (label_replace(node_memory_MemAvailable_bytes{cluster=~\"$cluster\"}, \"internal_ip\", \"$1\", \"instance\", \"([^:]+):.*\") * on (cluster, internal_ip) group_left(node) max by (cluster, node, internal_ip) (kube_node_info{cluster=~\"$cluster\",node=~\"$node\"})) / sum by (cluster, node) (label_replace(node_memory_MemTotal_bytes{cluster=~\"$cluster\"}, \"internal_ip\", \"$1\", \"instance\", \"([^:]+):.*\") * on (cluster, internal_ip) group_left(node) max by (cluster, node, internal_ip) (kube_node_info{cluster=~\"$cluster\",node=~\"$node\"}))) * 100",
              "legendFormat": "{{cluster}}/{{node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            }
          }
        },
        {
          "type": "stat",
          "title": "OTLP Spans Received (Alloy UI note)",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{cluster=\"\",pod=~\"alloy.*\"}[5m]))",
              "refId": "A",
              "legendFormat": "alloy cpu"
            }
          ]
        },
        {
          "type": "stat",
          "title": "ops-agent Ready",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{cluster=\"\",namespace=\"application\",deployment=\"ops-agent\"}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Node CPU / Memory",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "100 - (avg by (cluster, node) (label_replace(rate(node_cpu_seconds_total{mode=\"idle\",cluster=~\"$cluster\"}[5m]), \"internal_ip\", \"$1\", \"instance\", \"([^:]+):.*\") * on (cluster, internal_ip) group_left(node) max by (cluster, node, internal_ip) (kube_node_info{cluster=~\"$cluster\",node=~\"$node\"})) * 100)",
              "legendFormat": "{{cluster}}/{{node}} cpu%",
              "refId": "A"
            },
            {
              "expr": "(1 - (sum by (cluster, node) (label_replace(node_memory_MemAvailable_bytes{cluster=~\"$cluster\"}, \"internal_ip\", \"$1\", \"instance\", \"([^:]+):.*\") * on (cluster, internal_ip) group_left(node) max by (cluster, node, internal_ip) (kube_node_info{cluster=~\"$cluster\",node=~\"$node\"})) / sum by (cluster, node) (label_replace(node_memory_MemTotal_bytes{cluster=~\"$cluster\"}, \"internal_ip\", \"$1\", \"instance\", \"([^:]+):.*\") * on (cluster, internal_ip) group_left(node) max by (cluster, node, internal_ip) (kube_node_info{cluster=~\"$cluster\",node=~\"$node\"}))) * 100",
              "legendFormat": "{{cluster}}/{{node}} mem%",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pod CPU (top)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "topk(8, sum by (cluster,namespace,pod) (rate(container_cpu_usage_seconds_total{cluster=~\"$cluster\",container!=\"\",container!=\"POD\"}[5m])))",
              "legendFormat": "{{cluster}}/{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "ops-agent Memory Working Set",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"application\",pod=~\"ops-agent.*\",container=\"ops-agent\"})",
              "legendFormat": "ops-agent",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "type": "traces",
          "title": "Recent Agent Traces (Tempo)",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "tempo", "uid": "tempo" },
          "targets": [
            {
              "queryType": "traceqlSearch",
              "filters": [
                {
                  "id": "service-name",
                  "tag": "service.name",
                  "operator": "=",
                  "value": ["ops-agent"],
                  "scope": "resource"
                }
              ],
              "limit": 20,
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["agent", "72602", "ops-agent"],
      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": {},
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(kube_node_info, cluster)",
            "includeAll": true,
            "label": "Cluster",
            "multi": true,
            "name": "cluster",
            "options": [],
            "query": "label_values(kube_node_info, cluster)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {},
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(kube_node_info{cluster=~\"$cluster\"}, node)",
            "includeAll": true,
            "label": "Node",
            "multi": true,
            "name": "node",
            "options": [],
            "query": "label_values(kube_node_info{cluster=~\"$cluster\"}, node)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "72602 Agent Overview",
      "uid": "agent-overview-72602",
      "version": 1
    }
