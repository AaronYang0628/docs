apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailu
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: mailu
  source:
    repoURL: https://mailu.github.io/helm-charts
    chart: mailu
    targetRevision: 2.7.3
    helm:
      releaseName: mailu
      values: |
        global:
          security:
            allowInsecureImages: true
        hostnames:
          - mail.72602.space
        domain: 72602.space
        timezone: Asia/Shanghai
        mailuVersion: 2024.06.57
        existingSecret: mailu-secrets
        initialAccount:
          enabled: true
          username: admin
          domain: 72602.space
          existingSecret: mailu-secrets
          existingSecretPasswordKey: initial-account-password
          mode: ifmissing
        imageRegistry: ghcr.nju.edu.cn
        persistence:
          single_pvc: true
          size: 100Gi
          accessModes:
            - ReadWriteOnce
          storageClass: local-path
        ingress:
          enabled: true
          ingressClassName: nginx
          tls: true
          existingSecret: mail.72602.space-tls
          realIpHeader: ""
          realIpFrom: 10.42.0.1/32
          proxyProtocol:
            imaps: true
            smtp: true
            smtps: true
            submission: true
          annotations:
            cert-manager.io/cluster-issuer: lets-encrypt
        front:
          hostPort:
            enabled: true
          podAnnotations:
            mailu.72602.space/config-version: proxy-v2-10.42.0.1
          updateStrategy:
            type: Recreate
          externalService:
            enabled: true
            type: ClusterIP
            ports:
              imaps: true
              smtp: true
              smtps: true
              submission: true
        rspamd:
          overrides:
            greylist.conf: |
              enabled = false;
        redis:
          enabled: true
          image:
            registry: m.daocloud.io/docker.io
            repository: bitnamilegacy/redis
          auth:
            enabled: false
          master:
            persistence:
              enabled: true
              storageClass: local-path
              size: 8Gi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
