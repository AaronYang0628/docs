apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roaminal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: roaminal
  source:
    repoURL: https://github.com/ben-wangz/roaminal.git
    targetRevision: d8415b9017796c364c56a7dfdaece59534e504b6
    path: chart
    helm:
      values: |
        image:
          digest: sha256:ef0784f5bb0e385dd97ed32331da0703f00d24acdaecbf49ed3701efac0ed4a6

        app:
          host: 0.0.0.0
          port: 9846
          acceptTerms: true
          initialCwd: /workspace
          maxConnectionInstances: 16
          maxClientsPerConnectionInstance: 8

        auth:
          existingSecret: roaminal-auth
          passwordKey: password

        persistence:
          enabled: true
          storageClass: local-path
          size: 20Gi
          annotations:
            argocd.argoproj.io/sync-options: Delete=false
            argocd.argoproj.io/sync-wave: "-2"

        ssh:
          source: pvc

        extraDeploy:
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: roaminal-ssh-bootstrap
              namespace: roaminal
              annotations:
                argocd.argoproj.io/sync-wave: "-1"
            spec:
              backoffLimit: 3
              activeDeadlineSeconds: 120
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: roaminal-ssh-bootstrap
                spec:
                  automountServiceAccountToken: false
                  restartPolicy: OnFailure
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 1000
                    runAsGroup: 1000
                    fsGroup: 1000
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: copy-ssh-material
                      image: ghcr.io/ben-wangz/roaminal@sha256:ef0784f5bb0e385dd97ed32331da0703f00d24acdaecbf49ed3701efac0ed4a6
                      imagePullPolicy: IfNotPresent
                      command:
                        - /bin/sh
                        - -ec
                        - |
                          umask 077
                          mkdir -p /mnt/roaminal-data/ssh
                          for name in config known_hosts_72602 known_hosts_zjlab known_hosts_ecs id_ed25519_72602 id_ed25519_zjlab id_ed25519_ecs; do
                            cp "/mnt/roaminal-ssh/$name" "/mnt/roaminal-data/ssh/$name"
                            chmod 600 "/mnt/roaminal-data/ssh/$name"
                          done
                          chmod 700 /mnt/roaminal-data/ssh
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop:
                            - ALL
                      volumeMounts:
                        - name: roaminal-data
                          mountPath: /mnt/roaminal-data
                        - name: roaminal-ssh
                          mountPath: /mnt/roaminal-ssh
                          readOnly: true
                  volumes:
                    - name: roaminal-data
                      persistentVolumeClaim:
                        claimName: roaminal-data
                    - name: roaminal-ssh
                      secret:
                        secretName: roaminal-ssh
                        defaultMode: 288

        ingress:
          enabled: true
          ingressClassName: nginx
          hostname: roam.72602.space
          path: /
          pathType: Prefix
          tls: true
          tlsSecret: roam.72602.space-tls
          annotations:
            cert-manager.io/cluster-issuer: lets-encrypt
            nginx.ingress.kubernetes.io/proxy-body-size: 10g
            nginx.ingress.kubernetes.io/proxy-buffering: "off"
            nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
