apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sub2api-token
  namespace: application
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt
spec:
  ingressClassName: nginx
  rules:
    - host: token.72602.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sub2api
                port:
                  number: 8080
  tls:
    - hosts:
        - token.72602.space
      secretName: token.72602.space-tls
